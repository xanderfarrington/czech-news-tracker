name: Czech News Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: czech-news-tracker
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      KEEP_HOURS: "48"
      TRANSLATE_LIMIT: "60"

      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:

      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # PYTHON
      # ----------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ----------------------------------------
      # CACHE TRANSLATION MODEL
      # ----------------------------------------

      - name: Cache MarianMT model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: marianmt-cs-en-v1

      # ----------------------------------------
      # INSTALL CPU-ONLY PYTORCH
      # ----------------------------------------

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install \
            "torch>=2.6,<3" \
            --index-url https://download.pytorch.org/whl/cpu

      # ----------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt

      # ----------------------------------------
      # RUN COLLECTOR
      # ----------------------------------------

      - name: Collect and translate Czech news
        run: |
          python collector.py

      # ----------------------------------------
      # COMMIT OUTPUTS
      # ----------------------------------------

      - name: Commit JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update Czech news tracker"
            git push
          else
            echo "No changes to commit."
          fi
