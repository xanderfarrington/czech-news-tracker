name: Czech News Tracker

on:
  schedule:
    - cron: "17 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: czech-news-tracker
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Argos translation models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-cs-en-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Czech News Collector
        env:
          KEEP_HOURS: "48"
          TRANSLATE_LIMIT: "30"
          ARGOS_PACKAGES_DIR: ~/.local/share/argos-translate/packages

        run: |
          python collector.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update Czech news data"
            git push
          else
            echo "No changes to commit."
          fi
