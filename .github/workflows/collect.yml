name: Czech News Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: czech-news-tracker
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      KEEP_HOURS: "48"
      TRANSLATE_LIMIT: "60"

      # Use Argos's lightweight sentence splitting.
      ARGOS_CHUNK_TYPE: "MINISBD"
      ARGOS_STANZA_AVAILABLE: "false"

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # CACHE TRANSLATION MODEL
      # ------------------------------------------------------

      - name: Cache Argos model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-czech-english-v3

      # ------------------------------------------------------
      # INSTALL CPU-ONLY PYTORCH
      # ------------------------------------------------------

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install \
            torch \
            --index-url https://download.pytorch.org/whl/cpu

      # ------------------------------------------------------
      # INSTALL PYTHON DEPENDENCIES
      # ------------------------------------------------------

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # RUN COLLECTOR
      # ------------------------------------------------------

      - name: Collect and translate Czech news
        run: |
          python collector.py

      # ------------------------------------------------------
      # COMMIT OUTPUTS
      # ------------------------------------------------------

      - name: Commit JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update Czech news tracker"
            git push
          else
            echo "No changes to commit."
          fi
